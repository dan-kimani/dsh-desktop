[package]
name = "dsh-desktop"
version = "0.1.7-rc.2"
description = "Tauri desktop wrapper around the DeepSeek Harness web application"
authors = ["dsh-desktop contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
# `time`/`macros` back the readiness deadline; `net`/`io-util` back the plain-HTTP
# session exchange. `rt` comes from Tauri's own async runtime; these features are
# additive and do not create a second runtime.
tokio = { version = "1", default-features = false, features = ["time", "macros", "net", "io-util"] }
# Parsing the launcher's URL for the session exchange (already in the tree via Tauri).
url = "2"
# PNG-encoding clipboard images for the WebKitGTK paste bridge. Only the `png`
# codec is used, so the default codec set is switched off.
image = { version = "0.25", default-features = false, features = ["png"] }
# Already in the tree via Tauri; declared directly for the data URL.
base64 = "0.22"

# WebKitGTK never surfaces clipboard images through the Web API (see
# src/clipboard.rs), so the host reads them natively instead. Other platforms
# already expose them to the paste event, so the bridge is Linux-only.
[target.'cfg(target_os = "linux")'.dependencies]
# `wayland-data-control` is required for a Wayland session to see the clipboard;
# the default X11 backend alone cannot.
arboard = { version = "3", features = ["wayland-data-control"] }

[features]
# This feature is used for production builds where `devUrl` points to the
# filesystem rather than to a running dev server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
